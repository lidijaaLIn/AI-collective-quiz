<!DOCTYPE html>
<html lang="sr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Kviz — simulacija sale</title>
<style>
  :root { --bg:#0a0e18; --card:#131926; --text:#eef2f8; --muted:#8f9bb3; --orange:#f97316; --blue:#3b82f6; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 15px/1.55 Inter,system-ui,sans-serif; padding:28px 24px 60px; }
  h1 { font:800 26px/1.2 Inter,sans-serif; letter-spacing:-.02em; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 26px; max-width:74ch; }
  .panel { background:var(--card); border:1px solid rgba(143,155,179,.2); border-radius:14px; padding:20px; max-width:900px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; }
  label { display:block; font:700 11px/1 Inter,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  input { background:#0a0e18; border:1px solid rgba(143,155,179,.3); border-radius:10px; color:var(--text); font:600 16px/1 Inter,sans-serif; padding:12px 14px; width:150px; }
  button { cursor:pointer; border:none; border-radius:10px; font:800 14px/1 Inter,sans-serif; padding:14px 22px; color:#fff; background:var(--blue); }
  button.go { background:linear-gradient(100deg,var(--orange),#fb923c); }
  button.off { background:#39415a; }
  button:disabled { opacity:.4; cursor:default; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; margin-top:24px; }
  .stat { background:rgba(143,155,179,.07); border-radius:12px; padding:14px 16px; }
  .stat .n { font:800 30px/1 Inter,sans-serif; }
  .stat .t { font:600 11px/1.3 Inter,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px; }
  #log { margin-top:22px; max-width:900px; max-height:320px; overflow:auto; background:#080b13; border:1px solid rgba(143,155,179,.16); border-radius:12px; padding:14px 16px; font:500 12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); }
  #log b { color:var(--text); font-weight:700; }
  #log .ok { color:var(--green); }
  #log .warn { color:var(--orange); }
  .guard { margin-top:22px; padding:14px 16px; border-radius:12px; border:1px solid var(--orange); background:rgba(249,115,22,.12); color:var(--orange); font-weight:600; max-width:900px; }
  code { background:rgba(143,155,179,.14); border-radius:5px; padding:2px 6px; font-size:.92em; }
</style>
</head><body>

<h1>Simulacija sale</h1>
<p class="sub">Pravi zadati broj lažnih igrača koji se prijave i sami odgovaraju na pitanja, kao da su u sali. Koristi se dok je host ekran otvoren u drugom tabu, na <b>istoj sesiji</b>. Nikad ne dira <code>kickoff</code> sesiju.</p>

<div class="panel">
  <div class="row">
    <div><label>Broj igrača</label><input id="count" type="number" min="1" max="80" value="40"></div>
    <div><label>Sesija</label><input id="sess" type="text" value="test"></div>
    <button class="go" id="startBtn">Pusti igrače u salu</button>
    <button class="off" id="clearBtn">Obriši ovu sesiju</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="sJoined">0</div><div class="t">prijavljeno</div></div>
    <div class="stat"><div class="n" id="sQ">—</div><div class="t">pitanje</div></div>
    <div class="stat"><div class="n" id="sAns">0</div><div class="t">odgovorilo</div></div>
    <div class="stat"><div class="n" id="sErr">0</div><div class="t">greške</div></div>
  </div>
</div>

<div id="guard"></div>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="questions.js"></script>
<script>
/* Simulator sale. Ne uvozi quiz-db.js jer taj fajl vezuje jedan igrač = jedan
   pretraživač (localStorage). Ovde svaki bot ima svoj id, pa jedan tab
   može da odigra celu salu. Formula za poene je ista kao u quiz-db.js. */

var QUESTION_TIME_SEC = 30;
var IMENA = ["Ana","Marko","Jovana","Nikola","Milica","Stefan","Katarina","Luka","Jelena","Vladimir",
  "Tijana","Filip","Sara","Nemanja","Ivana","Dušan","Maja","Aleksa","Nina","Petar",
  "Teodora","Miloš","Anđela","Vuk","Sofija","Bojan","Dunja","Lazar","Marija","Uroš",
  "Kristina","Đorđe","Lena","Pavle","Isidora","Relja","Zorana","Ognjen","Mina","Bogdan"];

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var logEl = document.getElementById("log");
function log(msg, cls) {
  var t = new Date().toLocaleTimeString("sr-RS");
  logEl.insertAdjacentHTML("afterbegin", '<div><b>' + t + '</b> <span class="' + (cls || "") + '">' + msg + "</span></div>");
}

var bots = [], stateSub = null, errCount = 0, joinedCount = 0, ansCount = 0;
function setStat(id, v) { document.getElementById(id).textContent = v; }
function bumpErr(e) { errCount++; setStat("sErr", errCount); log("greška: " + (e && e.message ? e.message : e), "warn"); }

function guardSession(s) {
  if (s === "kickoff") {
    document.getElementById("guard").innerHTML =
      'Sesija <code>kickoff</code> je pravi event i ovaj alat je ne dira. Upiši drugo ime sesije, npr. <code>test</code>.';
    return false;
  }
  document.getElementById("guard").innerHTML = "";
  return true;
}

document.getElementById("startBtn").onclick = function () {
  var n = Math.max(1, Math.min(80, parseInt(document.getElementById("count").value, 10) || 40));
  var sess = (document.getElementById("sess").value || "test").trim().replace(/[^A-Za-z0-9_-]/g, "");
  if (!guardSession(sess)) return;
  if (typeof QUESTIONS === "undefined" || !QUESTIONS.length) { log("questions.js nije učitan", "warn"); return; }

  this.disabled = true;
  var self = this;
  var sessionRef = db.ref("quiz/" + sess);
  var playersRef = sessionRef.child("players");
  var answersRef = sessionRef.child("answers");
  var stateRef = sessionRef.child("state");

  bots = [];
  joinedCount = 0; ansCount = 0; errCount = 0;
  setStat("sJoined", 0); setStat("sAns", 0); setStat("sErr", 0);
  log("prijavljujem " + n + " igrača u sesiju <b>" + sess + "</b>");

  /* prijava — svi u istom trenutku, kao QR skeniranje u sali */
  for (var i = 0; i < n; i++) {
    var id = "bot_" + Math.random().toString(36).slice(2, 10);
    var name = IMENA[i % IMENA.length] + (i >= IMENA.length ? " " + (i + 1) : "") + " (test)";
    bots.push({ id: id, name: name, answered: {} });
    playersRef.child(id).set({ name: name, score: 0, joinedAt: firebase.database.ServerValue.TIMESTAMP })
      .then(function () { joinedCount++; setStat("sJoined", joinedCount); })
      .catch(bumpErr);
  }

  /* svaki bot odgovara sam, u slučajnom trenutku unutar vremena za pitanje */
  if (stateSub) stateRef.off("value", stateSub);
  stateSub = stateRef.on("value", function (snap) {
    var st = snap.val();
    if (!st || !st.status) { setStat("sQ", "—"); return; }
    if (st.status !== "question") { setStat("sQ", st.status); return; }

    var qi = st.qIndex, q = QUESTIONS[qi];
    if (!q) return;
    setStat("sQ", (qi + 1) + " / " + QUESTIONS.length);
    ansCount = 0; setStat("sAns", 0);
    log("pitanje " + (qi + 1) + " — " + bots.length + " igrača odgovara");

    bots.forEach(function (b) {
      if (b.answered[qi]) return;
      b.answered[qi] = true;
      /* 70% šanse da bot zna odgovor, ostalo slučajno — da tabela ima raspon */
      var choice = Math.random() < 0.7 ? q.correct : Math.floor(Math.random() * q.options.length);
      var delay = 1200 + Math.random() * (QUESTION_TIME_SEC - 4) * 1000;
      setTimeout(function () {
        var now = Date.now();
        var elapsed = st.questionStartedAt ? Math.max(0, (now - st.questionStartedAt) / 1000) : 99;
        var correct = q.correct === choice;
        var points = correct ? 100 + Math.max(0, Math.round(50 - elapsed * 3.5)) : 0;
        answersRef.child(qi).child(b.id).set({ choice: choice, correct: correct, ts: now, points: points })
          .then(function () { ansCount++; setStat("sAns", ansCount); })
          .catch(bumpErr);
        if (points > 0) {
          playersRef.child(b.id).transaction(function (cur) {
            if (!cur) return cur;
            cur.score = (cur.score || 0) + points;
            return cur;
          }).catch(bumpErr);
        }
      }, delay);
    });
  }, bumpErr);

  log("slušam host ekran — pokreni kviz na host.html?session=" + sess, "ok");
  setTimeout(function () { self.disabled = false; }, 2500);
};

document.getElementById("clearBtn").onclick = function () {
  var sess = (document.getElementById("sess").value || "test").trim().replace(/[^A-Za-z0-9_-]/g, "");
  if (!guardSession(sess)) return;
  db.ref("quiz/" + sess).remove()
    .then(function () {
      bots = [];
      joinedCount = 0; ansCount = 0;
      setStat("sJoined", 0); setStat("sAns", 0); setStat("sQ", "—");
      log("sesija <b>" + sess + "</b> obrisana", "ok");
    })
    .catch(bumpErr);
};

log("spremno. Host otvori na <b>host.html?session=test</b> u drugom tabu.");
</script>
</body></html>
